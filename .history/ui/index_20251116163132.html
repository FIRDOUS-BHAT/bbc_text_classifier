<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BBC Text Classifier — Demo</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; max-width:700px; margin:40px auto; padding:0 20px; }
    textarea { width:100%; height:160px; font-size:14px; padding:8px; }
    button { padding:10px 16px; font-size:15px; border-radius:8px; cursor:pointer; }
    .result { margin-top:18px; background:#f7f7f7; padding:12px; border-radius:8px; }
    .scores { margin-top:8px; font-family: monospace; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h2>BBC Text Classifier (Demo)</h2>
  <p>Paste a news paragraph and press Predict.</p>
  <textarea id="inputText" placeholder="Type or paste news text here...">The government announced new measures to support small businesses during the downturn.</textarea>
  <div style="margin-top:10px;">
    <button id="btn">Predict</button>
  </div>

  <div id="out" class="result" style="display:none;">
    <div><strong>Prediction:</strong> <span id="pred"></span></div>
    <div class="scores" id="scores"></div>
  </div>

<script>
const btn = document.getElementById('btn');
btn.addEventListener('click', async () => {
  const text = document.getElementById('inputText').value;
  if (!text || !text.trim()) return alert("Enter text");
  btn.disabled = true;
  btn.textContent = "Predicting...";
  try {
    const res = await fetch('http://127.0.0.1:8000/predict', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    if (!res.ok) {
      const j = await res.json();
      throw new Error(j.detail || "Request failed");
    }
    const j = await res.json();
    document.getElementById('pred').textContent = j.prediction;
    document.getElementById('scores').textContent = JSON.stringify(j.scores, null, 2);
    document.getElementById('out').style.display = 'block';
  } catch (err) {
    alert("Error: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Predict";
  }
});
</script>
</body>
</html>
